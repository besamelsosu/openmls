[package]
name = "cli"
version = "0.1.0"
authors = ["OpenMLS Authors"]
edition = "2021"
publish = false

[features]
# Forward feature to openmls and the storage backend.
extensions-draft = [
    "openmls/extensions-draft",
    "openmls/extensions-draft-test-dependencies",
    "openmls_sqlite_storage/extensions-draft",
]

[dependencies]
url = "2.2"
reqwest = { version = "0.13", features = ["blocking", "json"] }
base64 = "0.22"
log = "0.4"
pretty_env_logger = "0.5"

openmls = { path = "../openmls", features = ["test-utils"] }
ds-lib = { path = "../delivery-service/ds-lib" }
openmls_traits = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_sqlite_storage = { workspace = true }
openmls_basic_credential = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
rustyline = "18.0"
